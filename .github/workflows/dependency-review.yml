name: Dependency review

# Only a change to a file that names a dependency can add one.
on:
  pull_request:
    paths:
      - "**/*.csproj"
      - "Directory.Build.props"
      - "dotnet-tools.json"
      - "global.json"
      - "ui/package.json"
      - "ui/pnpm-lock.yaml"
      - "ui/pnpm-workspace.yaml"
      - "Dockerfile"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails a pull request that adds a dependency with a known vulnerability.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
